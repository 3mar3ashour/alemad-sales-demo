  function bindModal() {
    const body = $('#mbody');
    $$('[data-pick]', body).forEach((b) => (b.onclick = () => {
      const key = b.dataset.pick; const idx = CASCADE.indexOf(key);
      if (D[key] !== b.dataset.v) CASCADE.slice(idx + 1).forEach((k) => { if (k !== 'colorId' && k !== 'productTypeId') D[k] = ''; });
      if (key === 'familyId' && D.productTypeId && (D.familyId === 'fixed') !== (D.productTypeId === 'fixed')) D.productTypeId = '';
      D[key] = b.dataset.v;
      if (key === 'seriesId') { const { ots } = options(D); if (!ots.some((o) => o.id === D.openingTypeId)) D.openingTypeId = ''; }
      if (key === 'productTypeId' && !D.code) D.code = nextCode(D.productTypeId, MOPT.existing);
      if (['seriesId', 'productTypeId', 'openingTypeId'].includes(key)) lookupPrice();
      renderModal();
      // تفتح القائمة التالية الفارغة مباشرة لتسريع الاختيار
      const nx = CASCADE.slice(idx + 1).find((k) => !D[k]);
      const nb = nx && $(`[data-dd="${nx}"] .dd-btn`);
      if (nb && !nb.disabled) openDD(nb.parentElement);
    }));
    $$('[data-k]', body).forEach((el) => {
      const k = el.dataset.k;
      const read = () => (el.type === 'checkbox' ? el.checked : el.value);
      if (el.dataset.re || el.tagName === 'SELECT') el.onchange = () => {
        setPath(D, k, read());
        if (k === 'glass.config' || k === 'glass.appearance') { if (D.glass.pricing === 'extra') D.glass.extraPrice = glassExtraDefault(); }
        renderModal();
      };
      else el.oninput = () => {
        setPath(D, k, read());
        if (k === 'pricePerM2') D.priceManual = true;
        const m = k.match(/^accessories\.(\d+)\./); if (m) $('#acc-tot-' + m[1]).innerHTML = accTotText(D.accessories[+m[1]]);
        if (k === 'qty') D.accessories.forEach((a, i) => { const t = $('#acc-tot-' + i); if (t) t.innerHTML = accTotText(a); });
        $('#calc').innerHTML = calcPanel();
      };
    });
    $$('[data-gp]', body).forEach((b) => (b.onclick = () => { D.glass.pricing = b.dataset.gp; if (D.glass.pricing === 'extra' && !D.glass.extraPrice) D.glass.extraPrice = glassExtraDefault(); renderModal(); }));
    $$('[data-sb]', body).forEach((b) => (b.onclick = () => { D.shutter.basis = b.dataset.sb; renderModal(); }));
    $$('[data-am]', body).forEach((b) => (b.onclick = () => { D.accessories[+b.dataset.am].mode = b.dataset.v; renderModal(); }));
    $$('[data-adel]', body).forEach((b) => (b.onclick = () => { D.accessories.splice(+b.dataset.adel, 1); renderModal(); }));
    bindDesign(body);
    $$('[data-acc]', body).forEach((b) => (b.onclick = () => {
      const a = byId(CAT.accessories, b.dataset.v); if (!a) return;
      D.accessories.push({ accId: a.id, perPiece: 1, totalOverride: null, mode: a.defaultMode || 'paid', price: a.price, color: '' }); renderModal();
    }));
    const addColor = (inputSel, kind, field) => {
      const name = $(inputSel).value.trim(); if (!name) return;
      const hx = $(inputSel + '-hex');
      // قيمة منتقي اللون تُستخدم فقط إن غيّرها المستخدم؛ وإلا يُستنتج اللون من اسمه
      const c = api('color.add', { kind, name, hex: hx && hx.dataset.touched ? hx.value : '' }); if (!c) return;
      CAT = api('catalog.get'); setPath(D, field, c.id); toast('حُفظ اللون في القاعدة'); renderModal();
    };

    if ($('#add-color')) $('#add-color').onclick = () => addColor('#new-color', 'product', 'colorId');
    if ($('#add-scolor')) $('#add-scolor').onclick = () => addColor('#new-scolor', 'shutter', 'shutter.colorId');
  }

  function diffTxt(o, n) {

  function priceModal() {
    PM = { tab: 'bulk', kinds: new Set(['m2', 'acc', 'glass', 'shutter']), company: '', category: '', mode: 'percent', value: '', round: '0', reason: '', excluded: new Set(), text: '', fileName: '', parsed: null };

    </div>`;
    document.body.appendChild(bg); document.body.style.overflow = 'hidden';
    const close = () => { bg.remove(); document.body.style.overflow = ''; };
    $('#pm-x').onclick = close; $('#pm-cancel').onclick = close;
    $$('[data-pmtab]', bg).forEach((b) => (b.onclick = () => { PM.tab = b.dataset.pmtab; PM.excluded.clear(); $$('[data-pmtab]', bg).forEach((x) => x.classList.toggle('on', x === b)); renderPMControls(); }));

      const btn = $('#pm-apply'); if (btn.disabled) return;
      const plan = currentPlan().filter((r) => !PM.excluded.has(r.key) && r.ok !== false);

      if (!confirm(`تطبيق ${plan.length} سعر جديد؟ العروض والفواتير القائمة لن تتغير.`)) return;
      btn.disabled = true;
      const desc = PM.tab === 'bulk' ? (PM.mode === 'percent' ? `${Number(PM.value) > 0 ? '+' : ''}${Number(PM.value)}%` : `${Number(PM.value) > 0 ? '+' : ''}${Number(PM.value)} ${cur()}`) : (PM.fileName || 'نص ملصق');
      const r = api('prices.bulk', { changes: plan.map((x) => ({ key: x.key, price: x.price })), source: PM.tab === 'import' ? 'import' : 'bulk', description: desc, reason: PM.reason, requestId: 'pb-' + uid() });
      if (r) { close(); toast(`حُدِّث ${r.count} سعر`); CAT = api('catalog.get'); pageCatalog(); } else btn.disabled = false;
    };
    renderPMControls();
  }
  function scopedItems() {
    return C.priceItems(CAT).filter((i) => PM.kinds.has(i.kind)
      && (!PM.company || i.companyId === PM.company)
      && (!PM.category || i.categoryIds.includes(PM.category)));
  }
  function currentPlan() {
    if (PM.tab === 'bulk') {
      if (PM.value === '' || !Number(PM.value)) return [];
      return C.planBulk(scopedItems(), { mode: PM.mode, value: PM.value, round: PM.round }).map((r) => Object.assign(r, { ok: r.price > 0 }));
    }
    if (!PM.parsed) return [];
    const map = new Map(C.priceItems(CAT, { includeEmpty: true }).map((i) => [i.key, i]));
    return PM.parsed.rows.map((r) => { const it = map.get(r.key);
      return it ? { key: r.key, label: it.label, unit: it.unit, old: it.price, price: C.money(r.price), ok: true, line: r.line } : { key: r.key, label: 'مفتاح غير معروف', old: null, price: r.price, ok: false, line: r.line }; });
  }
  function renderPMControls() {
    const el = $('#pm-controls');
    const companies = CAT.companies.filter((c) => c.kind === 'profiles' || c.id === 'roto');
    const reason = `<label class="f" style="margin-top:10px">سبب التحديث (يظهر في السجل)<input type="text" id="pm-reason" value="${esc(PM.reason)}" placeholder="مثل: زيادة أسعار المورد"></label>`;
    if (PM.tab === 'bulk') {
      el.innerHTML = `<div class="grid g4">
        <div class="f" style="grid-column:1/-1"><span class="small" style="font-weight:600">ما يشمله التحديث</span><div class="chips">${Object.keys(KINDS).map((k) => `<label class="chip ${PM.kinds.has(k) ? 'on' : ''}"><input type="checkbox" data-pmkind="${k}" ${PM.kinds.has(k) ? 'checked' : ''} class="hidden">${KINDS[k]}</label>`).join('')}</div></div>
        <label class="f">الشركة<select id="pm-co"><option value="">كل الشركات</option>${companies.map((c) => `<option value="${c.id}" ${PM.company === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
        <label class="f">الفئة<select id="pm-cat"><option value="">كل الفئات</option>${CAT.categories.map((c) => `<option value="${c.id}" ${PM.category === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
        <div class="f"><span class="small" style="font-weight:600">طريقة التعديل</span><span class="seg"><button data-pmmode="percent" class="${PM.mode === 'percent' ? 'on' : ''}">نسبة %</button><button data-pmmode="amount" class="${PM.mode === 'amount' ? 'on' : ''}">مبلغ ثابت</button></span></div>
        <label class="f">القيمة (سالبة للتخفيض)<input type="number" step="0.01" id="pm-val" value="${esc(PM.value)}" placeholder="${PM.mode === 'percent' ? 'مثل 10' : 'مثل 15'}"></label>
        <label class="f">التقريب<select id="pm-round">${[['0', 'بدون تقريب'], ['0.5', 'لأقرب 0.5'], ['1', 'لأقرب 1'], ['5', 'لأقرب 5']].map(([v, t]) => `<option value="${v}" ${PM.round === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      </div>
      <p class="small muted">يُطبَّق على الأسعار المحددة فقط. ما لا سعر له يُسعَّر من الجدول أو برفع ملف.</p>${reason}`;
      $$('[data-pmkind]').forEach((c) => (c.onchange = () => { c.checked ? PM.kinds.add(c.dataset.pmkind) : PM.kinds.delete(c.dataset.pmkind); c.parentElement.classList.toggle('on', c.checked); renderPMPreview(); }));
      $$('[data-pmmode]').forEach((b) => (b.onclick = () => { PM.mode = b.dataset.pmmode; renderPMControls(); }));
      $('#pm-co').onchange = (e) => { PM.company = e.target.value; renderPMPreview(); };
      $('#pm-cat').onchange = (e) => { PM.category = e.target.value; renderPMPreview(); };
      $('#pm-val').oninput = (e) => { PM.value = e.target.value; renderPMPreview(); };
      $('#pm-round').onchange = (e) => { PM.round = e.target.value; renderPMPreview(); };
    } else {
      el.innerHTML = `<div class="grid g2">
        <div class="f"><span class="small" style="font-weight:600">1. نزّل القالب واملأ عمود «السعر الجديد»</span>
          <button class="btn" id="pm-tpl">تنزيل قالب الأسعار (CSV)</button>
          <span class="tiny muted">يفتح في Excel. احفظه بصيغة CSV UTF-8. السطر الذي يُترك سعره الجديد فارغًا لا يتغير.</span></div>
        <div class="f"><span class="small" style="font-weight:600">2. ارفع الملف</span>
          <input type="file" id="pm-file" accept=".csv,.json,.txt,text/csv,application/json">
          <span class="tiny muted">${PM.fileName ? 'الملف: ' + esc(PM.fileName) : 'CSV أو JSON بالشكل [{"key":"…","price":…}]'}</span></div>
      </div>
      <details style="margin-top:8px"><summary class="small">أو الصق المحتوى مباشرة</summary><textarea id="pm-text" style="margin-top:6px;min-height:110px" placeholder="المفتاح,…,السعر الجديد">${esc(PM.text)}</textarea></details>${reason}`;
      $('#pm-tpl').onclick = () => {
        const blob = new Blob([C.priceTemplateCSV(CAT)], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `alemad-prices-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      };
      $('#pm-file').onchange = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = () => { PM.fileName = f.name; PM.text = rd.result; PM.parsed = C.parsePriceFile(PM.text); PM.excluded.clear(); renderPMControls(); };
        rd.readAsText(f, 'utf-8');
      };
      $('#pm-text').oninput = (e) => { PM.text = e.target.value; PM.fileName = ''; PM.parsed = C.parsePriceFile(PM.text); PM.excluded.clear(); renderPMPreview(); };
    }
    $('#pm-reason').oninput = (e) => { PM.reason = e.target.value; };
    renderPMPreview();
  }
  function renderPMPreview() {
    const plan = currentPlan();
    const errs = PM.tab === 'import' && PM.parsed ? PM.parsed.errors : [];
    const bad = plan.filter((r) => !r.ok);
    const good = plan.filter((r) => r.ok && !PM.excluded.has(r.key));
    $('#pm-preview').innerHTML = `
      ${errs.length ? `<div class="err-list" style="margin-top:12px"><b>أسطر لم تُقرأ:</b><ul>${errs.slice(0, 8).map((e) => `<li>${esc(e)}</li>`).join('')}${errs.length > 8 ? `<li>و${errs.length - 8} غيرها</li>` : ''}</ul></div>` : ''}
      ${bad.length ? `<div class="err-list" style="margin-top:12px"><b>${PM.tab === 'import' ? 'مفاتيح غير معروفة، لن تُطبَّق' : 'أسعار ستصبح صفرًا أو أقل، لن تُطبَّق'}:</b><ul>${bad.slice(0, 8).map((r) => `<li>${r.line ? 'سطر ' + r.line + ': ' : ''}<bdi>${esc(PM.tab === 'import' ? r.key : r.label)}</bdi></li>`).join('')}</ul></div>` : ''}
      <h3>المعاينة</h3>
      ${plan.filter((r) => r.ok).length ? `<div class="tw"><table><thead><tr><th></th><th>البند</th><th>الوحدة</th><th class="n">الحالي</th><th class="n">الجديد</th><th class="n">الفرق</th></tr></thead><tbody>
        ${plan.filter((r) => r.ok).map((r) => `<tr><td><input type="checkbox" data-pmx="${esc(r.key)}" ${PM.excluded.has(r.key) ? '' : 'checked'} aria-label="تضمين"></td><td>${bidi(r.label)}</td><td>${esc(r.unit)}</td>
          <td class="n">${r.old == null ? '<span class="badge bad">بلا سعر</span>' : fm(r.old)}</td><td class="n"><b>${fm(r.price)}</b></td><td class="n">${r.old == null ? 'جديد' : diffTxt(r.old, r.price)}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">${PM.tab === 'bulk' ? 'أدخل قيمة التعديل لعرض الأسعار الجديدة.' : 'نزّل القالب واملأه ثم ارفعه، أو الصق المحتوى.'}</div>`}`;
    $$('[data-pmx]').forEach((c) => (c.onchange = () => { c.checked ? PM.excluded.delete(c.dataset.pmx) : PM.excluded.add(c.dataset.pmx); updatePMFoot(); }));
    updatePMFoot();
  }
  function updatePMFoot() {
    const n = currentPlan().filter((r) => r.ok && !PM.excluded.has(r.key)).length;
    $('#pm-count').textContent = n ? `سيتغير ${n} سعر` : '';
    $('#pm-apply').disabled = !n;
    $('#pm-apply').textContent = n ? `تطبيق (${n})` : 'تطبيق';
  }
  function listEditor(title, list, items, mc) {
    return `<div><h3>${title}</h3><div class="chips" style="margin-bottom:6px">${items.map((i) => `<span class="badge">${esc(i.name)}</span>`).join('')}</div>
      ${mc ? `<div class="row"><input type="text" data-new="${list}" placeholder="إضافة…" style="flex:1;min-width:0"><button class="btn sm" data-newgo="${list}">إضافة</button></div>` : ''}</div>`;
  }
  function bindCatalog() {
    const re = () => { CAT = api('catalog.get'); pageCatalog(); };
    $$('[data-s]').forEach((el) => (el.onchange = () => { if (api('settings.update', { [el.dataset.s]: el.value })) { toast('حُفظ'); re(); } }));
    if ($('#shutter-price')) $('#shutter-price').onchange = (e) => { if (api('price.set', { kind: 'shutter', price: e.target.value })) { toast('حُفظ السعر'); re(); } };
    $$('[data-mr]').forEach((el) => (el.onchange = () => { if (api('producttype.minrule', { id: el.dataset.mr, minRule: el.checked })) re(); }));
    $$('[data-price]').forEach((el) => (el.onchange = () => { const [s, p] = el.dataset.price.split('|'); if (api('price.set', { seriesId: s, productTypeId: p, price: el.value })) { toast('حُفظ السعر'); re(); } }));
    $$('[data-accp]').forEach((el) => (el.onchange = () => { if (api('price.set', { kind: 'accessory', accId: el.dataset.accp, price: el.value })) { toast('حُفظ السعر'); re(); } }));
    $$('[data-gprice]').forEach((el) => (el.onchange = () => { const [c, a] = el.dataset.gprice.split('|'); if (api('price.set', { kind: 'glass', config: c, appearance: a, price: el.value })) { toast('حُفظ السعر'); re(); } }));
    $$('[data-newgo]').forEach((b) => (b.onclick = () => {
      const l = b.dataset.newgo, name = $(`[data-new="${l}"]`).value.trim(); if (!name) return;
      const item = { name }; if (l === 'categories') item.active = true;
      if (api('catalog.upsert', { list: l, item })) re();
    }));
    if ($('#ns-go')) $('#ns-go').onclick = () => { const name = $('#ns-name').value.trim(); if (!name) return toast('اسم السلسلة مطلوب', true);
      if (api('catalog.upsert', { list: 'series', item: { companyId: $('#ns-co').value, name, systems: [$('#ns-sys').value], depthMm: Number($('#ns-depth').value) || null, source: 'أُدخلت يدويًا' } })) re(); };
    if ($('#na-go')) $('#na-go').onclick = () => { if (api('catalog.upsert', { list: 'accessories', item: { code: $('#na-code').value.trim().toUpperCase(), name: $('#na-name').value.trim(), unit: $('#na-unit').value, defaultMode: $('#na-mode').value } })) re(); };
    if ($('#pm-open')) $('#pm-open').onclick = priceModal;
    if ($('#reset')) $('#reset').onclick = () => { if (confirm('حذف كل العروض والفواتير وإعادة بيانات التجربة؟')) { server.reset(S.seed()); toast('أعيدت البيانات'); route(); } };
  }

  // ---------- الصلاحيات ----------
  function pageUsers() {
    const users = api('users.list') || [];
    const mu = can('users.manage');
    const perms = Object.keys(C.PERMS);
    $('#main').innerHTML = `<div class="page-head"><h1>الصلاحيات</h1></div>
      <div class="card"><p class="small muted" style="margin-top:0">لمالك النظام ومدير النظام صلاحية كاملة. مدير المبيعات والمندوب يعملان بما يُمنح لهما هنا. كل عملية يتحقق منها الخادم، والمحاولات المرفوضة تُسجَّل.</p>
      ${!mu ? '<div class="demo-banner">عرض فقط: تعديل الصلاحيات لمالك النظام ومدير النظام.</div>' : ''}
      <div class="tw"><table class="perm-grid"><thead><tr><th>الصلاحية</th>${users.map((u) => `<th>${esc(u.name)}<div class="tiny muted">${esc(C.ROLES[u.role])}</div></th>`).join('')}</tr></thead><tbody>
        ${perms.map((p) => `<tr><td>${esc(C.PERMS[p])}</td>${users.map((u) => { const full = u.role === 'owner' || u.role === 'admin';
          return `<td><input type="checkbox" aria-label="${esc(C.PERMS[p])} — ${esc(u.name)}" data-g="${u.id}|${p}" ${full || u.grants.includes(p) ? 'checked' : ''} ${full || !mu ? 'disabled' : ''}></td>`; }).join('')}</tr>`).join('')}
      </tbody></table></div></div>`;
    $$('[data-g]').forEach((el) => (el.onchange = () => {
      const [uidv, p] = el.dataset.g.split('|'); const u = users.find((x) => x.id === uidv);
      const grants = el.checked ? [...new Set(u.grants.concat(p))] : u.grants.filter((g) => g !== p);
      if (api('user.grants', { userId: uidv, grants })) { toast('حُفظت الصلاحيات'); pageUsers(); } else pageUsers();
    }));
  }
  function pageAudit() {
    const log = api('audit.list'); if (!log) { $('#main').innerHTML = `<div class="card empty">لا تملك صلاحية عرض سجل التدقيق.</div>`; return; }
    $('#main').innerHTML = `<div class="page-head"><h1>سجل التدقيق</h1></div><div class="card">${log.length ? `<div class="tw"><table><thead><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th><th>الهدف</th><th>التفاصيل</th></tr></thead><tbody>
      ${log.map((l) => `<tr><td class="num small">${esc(l.at.replace('T', ' ').slice(0, 19))}</td><td>${esc(l.userName)}</td><td>${l.action === 'محاولة مرفوضة' ? `<span class="badge bad">${esc(l.action)}</span>` : esc(l.action)}</td><td class="num">${esc(l.target)}</td><td class="small">${esc(l.detail)}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">السجل فارغ.</div>'}</div>`;
  }

  frame();
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
