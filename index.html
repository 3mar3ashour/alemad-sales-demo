<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>document.documentElement.setAttribute("lang","ar");document.documentElement.setAttribute("dir","rtl");</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>العماد — المبيعات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  /* ألمنيوم فاتح للخلفية، جرافيت مؤكسد للنص والهيدر، وتركواز حافة الزجاج للأفعال */
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#15202b; --ink-2:#384452; --muted:#66717e;
  --line:#dde2e8; --line-2:#c9d0d8; --accent:#0a7c86; --accent-2:#086871; --accent-ink:#ffffff; --accent-soft:#e2f1f2;
  --brand:#17212c; --brand-2:#223040; --edge:#46c3cb;
  --ok:#1f7a4f; --ok-soft:#e3f3ea; --warn:#93600e; --warn-soft:#fbf1dd; --bad:#b42318; --bad-soft:#fde9e7;
  --radius:14px; --r-field:10px; --shadow:0 1px 2px rgba(21,32,43,.05),0 8px 24px -12px rgba(21,32,43,.18);
  font-family:'Alexandria',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Alexandria',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.55}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.money{display:inline-flex;gap:4px;align-items:baseline;white-space:nowrap}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.hidden{display:none!important}

/* ---------- الهيكل ---------- */
/* شريط واحد كمقطع ألمنيوم مؤكسد: لمعة رفيعة أعلاه، وحافة زجاج تحت القسم الحالي */
.topbar{background:linear-gradient(180deg,#1e2a37 0%,var(--brand) 100%);color:#fff;position:sticky;top:0;z-index:20;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 6px 18px -10px rgba(10,18,28,.6)}
.topbar-in{max-width:1240px;margin:0 auto;padding:12px 20px 8px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px;letter-spacing:0}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(160deg,#12939d,var(--accent));display:grid;place-items:center;font-size:19px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -2px 0 rgba(0,0,0,.2)}
.brand small{display:block;font-weight:500;font-size:12px;color:#9fb0bf}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:#b6c2ce}
.who select{background:var(--brand-2);border:1px solid #33475a;color:#fff;border-radius:var(--r-field);padding:6px 10px;min-height:0;max-width:190px}
.nav{background:transparent}
.nav-in{max-width:1240px;margin:0 auto;padding:0 12px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav a{padding:10px 12px 11px;text-decoration:none;color:#aebbc7;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;transition:color .15s}
.nav a:hover{color:#fff}
.nav a.on{color:#fff;border-bottom-color:var(--edge)}
main{max-width:1240px;margin:0 auto;padding:26px 20px 70px}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{margin:0;font-size:28px;font-weight:800;line-height:1.25}
.page-head .actions{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.demo-banner{background:var(--warn-soft);color:var(--warn);border:1px solid #efd9ad;border-radius:var(--radius);padding:8px 12px;font-size:13px;margin-bottom:14px}

/* ---------- عناصر ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;min-width:0}
.card h2{margin:0 0 14px;font-size:18px;font-weight:700}
.card h3{margin:14px 0 8px;font-size:15px;font-weight:700}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);font-weight:600;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{width:100%;border:1px solid var(--line-2);border-radius:var(--r-field);padding:9px 12px;min-height:42px;background:#fff;min-width:0;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:#aeb7c2}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,124,134,.16)}
input[type=color]{width:42px;height:42px;padding:3px;border:1px solid var(--line-2);border-radius:var(--r-field);background:#fff;cursor:pointer}
textarea{min-height:70px;resize:vertical}
.btn{border:1px solid var(--line-2);background:#fff;border-radius:var(--r-field);padding:9px 16px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background-color .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:#aeb7c2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 4px 12px -6px rgba(10,124,134,.7)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.dark{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.dark:hover{background:var(--brand-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:#efc4c0}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip small{opacity:.7;font-weight:500}
.badge{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:#c6e3d1}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:#efd9ad}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:#f2c7c3}
.badge.info{background:#e8edf6;color:#2c4a7a;border-color:#cdd8ea}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-field);overflow:hidden;flex-wrap:wrap;background:var(--surface-2);padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:600;border-radius:7px;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(21,32,43,.14)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.err-list{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:13px;margin:0 0 12px;white-space:pre-line}
.err-list ul{margin:0;padding-inline-start:18px}

/* ---------- جداول ---------- */
.tw{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:transparent;white-space:nowrap;border-bottom-color:var(--line-2)}
tbody tr:hover td{background:#fafbfc}
td.n,th.n{text-align:end;white-space:nowrap}
td.num,th.num{display:table-cell}
.tw table.wide{min-width:860px}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
tfoot td{font-weight:800}

/* ---------- الفتحات ---------- */
.op{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;background:var(--surface-2)}
.op-head{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.op-code{font-weight:800;font-size:15px;background:var(--brand);color:#fff;border-radius:8px;padding:2px 9px}
.op-title{font-weight:700;min-width:0;flex:1}
.op-title .muted{font-weight:500}
.op-figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.fig{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.fig b{display:block;font-size:16px}
.fig span{font-size:12px;color:var(--muted)}
.fig.hl{border-color:var(--accent);background:var(--accent-soft)}
.op-extras{margin-top:8px;font-size:13px;display:flex;flex-direction:column;gap:3px}

/* ---------- نافذة الفتحة ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(14,22,32,.5);backdrop-filter:blur(2px);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:0 12px}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:1080px;margin:24px 0;box-shadow:0 30px 70px -20px rgba(10,18,28,.45)}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);border-radius:18px 18px 0 0;z-index:2}
.modal-head h2{margin:0;font-size:19px;font-weight:700}
.modal-body{padding:20px 22px}
.modal-foot{display:flex;gap:8px;padding:14px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);border-radius:0 0 18px 18px;flex-wrap:wrap}
.step{border-inline-start:3px solid var(--line);padding:2px 0 10px 0;padding-inline-start:12px;margin-bottom:6px}
.step.done{border-inline-start-color:var(--accent)}
.step-t{font-weight:800;font-size:14px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.step-t i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--line);display:inline-grid;place-items:center;font-size:12px}
.step.done .step-t i{background:var(--accent);color:#fff}
.calc{position:sticky;top:70px}
.calc .line{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.calc .line:last-child{border-bottom:0}
.calc .big{font-size:22px;font-weight:800;color:var(--accent)}
.acc-row{display:grid;grid-template-columns:minmax(0,2.2fr) 90px 110px minmax(0,1.3fr) 100px 36px;gap:8px;align-items:end;padding:8px 0;border-bottom:1px dashed var(--line)}
.acc-row .tot{font-size:13px;padding-bottom:8px}

/* ---------- المستند (فاتورة/عرض) ---------- */
.doc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
.doc-head{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid var(--brand);padding-bottom:14px;margin-bottom:14px;flex-wrap:wrap}
.doc-brand{display:flex;gap:12px;align-items:center}
.doc-brand .brand-mark{width:52px;height:52px;font-size:26px;color:#fff;border-radius:10px}
.doc-brand h2{margin:0;font-size:26px;font-weight:800;color:var(--brand)}
.doc-title{text-align:end}
.doc-title h3{margin:0;font-size:22px;color:var(--accent)}
.doc-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 18px;margin-bottom:14px;font-size:14px}
.doc-meta div span{display:block;color:var(--muted);font-size:12px}
.doc h4{margin:18px 0 8px;font-size:15px;color:var(--brand);border-bottom:1px solid var(--line);padding-bottom:4px}
.totals{margin-inline-start:auto;max-width:360px;width:100%}
.totals .line{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
.totals .line.grand{font-size:18px;font-weight:800;color:var(--brand);border-bottom:2px solid var(--brand)}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px;font-size:13px;color:var(--muted)}
.sig div{border-top:1px solid var(--line-2);padding-top:6px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi > span{color:var(--muted);font-size:13px} .kpi b{display:block;font-size:26px;font-weight:800;margin-top:2px}
.toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:min(560px,calc(100vw - 32px));white-space:pre-line;font-size:14px;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad)}
.perm-grid th,.perm-grid td{text-align:center}
.perm-grid td:first-child,.perm-grid th:first-child{text-align:start}
details.ph{border-bottom:1px solid var(--line);padding:8px 0}
details.ph summary{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.ph .tw{margin-top:8px}
label.chip{display:inline-flex;align-items:center}
.shape{display:block;flex:none;max-width:100%;height:auto}
td.ico{width:46px;padding-inline:4px}
td.ico .shape{margin:auto}
.op-fig{flex:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px}
.chip-ico{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 8px}
.chip-ico .shape{background:#fff;border-radius:4px}
.acc-name{display:inline-flex;align-items:center;gap:8px}
.calc-fig{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:8px;background:var(--surface-2);border-radius:8px;padding:8px}
.docs[data-show=summary] .doc-detail,.docs[data-show=detail] .doc-summary{display:none}
.docs .doc + .doc{margin-top:14px}
.opc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.split .opc-grid{grid-template-columns:minmax(0,1fr)}
.opc{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px;break-inside:avoid;background:#fff}
.opc-fig{display:flex;align-items:flex-start;justify-content:center;background:var(--surface-2);border-radius:8px;padding:4px}
.opc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;margin:8px 0;font-size:13px}
.kv div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dashed var(--line);padding:2px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.opc-acc{list-style:none;margin:6px 0;padding:0;font-size:13px}
.opc-acc li{display:flex;align-items:center;gap:8px;padding:3px 0}
.opc-acc li > span{flex:1;min-width:0}
.opc-total{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:6px;font-size:13px}
.opc-sum{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;background:var(--surface-2);border-radius:8px;font-size:14px}
.sum-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:6px}
.sum-grid .line.pay{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px}
.empty{padding:30px;text-align:center;color:var(--muted)}

@media (max-width:900px){
  .opc-grid{grid-template-columns:minmax(0,1fr)}
  .split{grid-template-columns:minmax(0,1fr)}
  .calc{position:static}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .doc-meta{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .opc{grid-template-columns:100px minmax(0,1fr);gap:8px}
  .kv{grid-template-columns:minmax(0,1fr)}
  .sum-grid{grid-template-columns:minmax(0,1fr);gap:4px}
  .op-fig .shape{width:56px;height:56px}
  main{padding:14px 16px 60px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand small{display:none}
  .who{margin-inline-start:0;width:100%}
  .who select{max-width:none;flex:1}
  .page-head h1{font-size:20px}
  .doc{padding:14px}
  .doc-meta{grid-template-columns:minmax(0,1fr)}
  .acc-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .acc-row > :first-child{grid-column:1/-1}
  .tw table{min-width:620px}
  .tw table.wide{min-width:760px}
  .acc-row > button{justify-self:start}
  .modal-bg{padding:0}
  .modal{border-radius:0;min-height:100vh;margin:0}
  .modal-head,.modal-foot{border-radius:0}
  .sig{grid-template-columns:1fr 1fr;gap:16px}
}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:12px}
  .no-print,.topbar,.nav,.toast{display:none!important}
  main{padding:0;max-width:none}
  .doc{border:0;box-shadow:none;padding:0}
  .tw{overflow:visible} .tw table,.tw table.wide{min-width:0}
  table{font-size:11px} th,td{padding:4px 5px}
  th{background:#f1eee8!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .brand-mark,.doc-head{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr,.totals{break-inside:avoid}
  .split{display:block}
  .docs[data-show=both] .doc-detail{display:block;break-before:page}
  .docs .doc + .doc{margin-top:0}
  .opc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opc{grid-template-columns:110px minmax(0,1fr)}
  .opc-fig .shape{width:110px;height:110px}
  .split .opc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{grid-template-columns:minmax(0,1fr)}
  .opc{font-size:11px}
}

/* ---------- القوائم المنسدلة ---------- */
.dd-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.dd{position:relative}
.dd-btn{width:100%;display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 12px;border:1px solid var(--line-2);border-radius:10px;background:#fff;cursor:pointer;text-align:start;font-weight:600}
.dd-btn:hover:not(:disabled){border-color:var(--brand)}
.dd-btn:focus-visible,.dd-opt:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dd-btn.ph{color:var(--muted);font-weight:500}
.dd-btn:disabled{background:var(--surface-2);cursor:not-allowed}
.dd.open .dd-btn{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,42,60,.08)}
.dd-car{margin-inline-start:auto;flex:none;width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-3px);opacity:.6;transition:transform .15s}
.dd.open .dd-car{transform:rotate(225deg) translate(-2px,-1px)}
.dd-menu{position:absolute;inset-inline:0;top:calc(100% + 4px);z-index:30;background:#fff;border:1px solid var(--line-2);border-radius:10px;box-shadow:0 12px 30px rgba(20,24,33,.16);max-height:320px;overflow-y:auto;padding:4px}
.dd-opt{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:start;font-weight:600}
.dd-opt:hover,.dd-opt:focus{background:var(--surface-2)}
.dd-opt[aria-selected=true]{background:var(--accent-soft);color:var(--accent)}
.dd-ico{flex:none;display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px}
.dd-txt{min-width:0;display:flex;flex-direction:column;line-height:1.35}
.dd-txt small{font-weight:500;color:var(--muted);font-size:12px}
.acc-dd{margin-top:8px;max-width:420px}

/* ---------- رأس المستند ورمز QR ---------- */
.doc-id{display:flex;align-items:flex-start;gap:14px}
.doc-no{font-weight:800;font-size:16px}
.doc-qr{flex:none;line-height:0;padding:3px;border:1px solid var(--line);border-radius:6px;background:#fff}
.doc-qr .qr{display:block}

/* ---------- المعاينة ---------- */
.pv-bg{position:fixed;inset:0;z-index:60;background:#52565c;display:flex;flex-direction:column}
.pv-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.2)}
.pv-t{font-size:16px}
.pv-pages{flex:1;overflow:auto;padding:20px 12px 40px}
.pv-note{text-align:center;color:#e8e8e8;font-size:12px;margin-top:4px}
.sheet{width:210mm;min-height:297mm;margin:0 auto 18px;background:#fff;padding:10mm;box-shadow:0 4px 18px rgba(0,0,0,.35)}

/* ورق: نفس شكل الطباعة، يستخدم في المعاينة وملف PDF */
.paper{background:#fff;font-size:12px;color:var(--ink)}
.paper .doc{border:0;box-shadow:none;padding:0;border-radius:0;display:block}
.paper .doc + .doc{margin-top:0}
.paper table{font-size:11px} .paper th,.paper td{padding:4px 5px}
.paper .tw{overflow:visible} .paper .tw table,.paper .tw table.wide{min-width:0}
.paper .doc-meta{grid-template-columns:repeat(3,minmax(0,1fr))}
.paper .sum-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.paper .opc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.paper .opc{grid-template-columns:110px minmax(0,1fr);font-size:11px}
.paper .opc-fig .shape{width:110px;height:110px}
.paper .kv{grid-template-columns:minmax(0,1fr)}
.paper .sig{grid-template-columns:1fr 1fr;gap:40px}
.sheet .paper .doc + .doc{margin-top:0}

@media (max-width:900px){ .dd-grid{grid-template-columns:minmax(0,1fr)} }
@media (max-width:600px){
  .doc-id{gap:8px}
  .doc-qr .qr{width:72px;height:72px}
  .pv-bar{padding:8px 12px}
  .pv-t{display:none}
  .pv-bar .seg{order:5;width:100%}
  .pv-bar .seg button{flex:1;padding:6px 6px;font-size:13px}
  .pv-pages{padding:12px 8px 30px}
}
@media print{
  .pv-bg{display:none!important}
  .doc-qr{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.opc-rows .opc-row + .opc-row{margin-top:10px}
/* جدول بنود العرض */
.ops td:nth-child(2){min-width:220px}
.ops td:last-child .row{flex-direction:column;align-items:stretch;gap:4px}
.sizes{margin:0;display:grid;gap:3px;font-size:13px;white-space:nowrap}
.sizes div{display:flex;gap:8px;justify-content:space-between}
.sizes dt{color:var(--muted)} .sizes dd{margin:0}
@media (max-width:600px){.tw table.ops{min-width:680px}}

/* عيّنة اللون في قائمة الألوان */
.swatch{display:block;width:26px;height:26px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(21,32,43,.18)}
.dd-ico .swatch{margin:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ميل منظوري خفيف للرسوم الكبيرة على الشاشة فقط، والمستندات والطباعة تبقى مستقيمة */
.calc-fig .shape,.opc-fig .shape{transform:perspective(720px) rotateY(-14deg) rotateX(3deg);transform-origin:50% 60%}
.paper .shape,.paper .opc-fig .shape{transform:none}
@media print{.shape{transform:none!important}}

/* تصميم النافذة والباب */
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.preset{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border:1px solid var(--line-2);border-radius:12px;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink-2);transition:border-color .15s,background-color .15s}
.preset:hover{border-color:var(--accent)}
.preset.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 2px rgba(10,124,134,.15)}
.design-ed{margin-top:12px;display:grid;gap:10px}
.drow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.drow-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.drow-h select{width:auto;min-height:34px;padding:4px 8px}
.dcells{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.dcell{display:grid;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.dcell select{min-height:36px;padding:5px 8px}

/* الإدخال السريع */
.btn.on-soft{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.qe{border:1px solid var(--line-2);border-radius:14px;background:var(--surface-2);padding:14px 16px;margin-bottom:16px}
.qe-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.qe-shared{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.qe-t{background:#fff;border-radius:10px}
.qe-t td{padding:6px 5px;vertical-align:middle}
.qe-t input,.qe-t select{min-height:36px;padding:5px 8px}
.qe-t .qe-qty{width:64px}.qe-t .qe-price{width:96px}
.qe-t td:nth-child(5) input,.qe-t td:nth-child(6) input{width:84px}
@media (max-width:900px){.tw table.qe-t{min-width:820px}}
.qe-t td:nth-child(2) select{min-width:120px}.qe-t td:nth-child(3) select{min-width:170px}

/* رمز تحميل الفاتورة وصفحة العرض من الرابط */
.doc-qr a{display:block;line-height:0}
.qr-cap{font-size:10px;line-height:1.3;text-align:center;color:var(--muted);margin-top:3px;white-space:nowrap}
body.viewer .nav,body.viewer .who{display:none}

<script>/* نواة منظومة العماد: الحساب، الفاتورة، والصلاحيات.
 * الواجهة لا تعدّل البيانات مباشرة: كل قراءة أو تعديل يمرّ عبر server.handle(userId, action, payload)
 * الذي يتحقق من الصلاحية ويكتب سجل التدقيق. في النسخة الحالية يعمل «الخادم» داخل المتصفح
 * فوق localStorage، ونفس الواجهة البرمجية جاهزة للنقل إلى خادم حقيقي.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.AlemadCore = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------- أرقام ----------
  const toMm = (m) => Math.round(Number(m) * 1000);
  const area = (wMm, hMm) => round((wMm * hMm) / 1e6, 4);
  function round(x, d) { const f = Math.pow(10, d); return Math.round((Number(x) + Number.EPSILON) * f) / f; }
  const money = (x) => round(x, 3);
  const clone = (o) => JSON.parse(JSON.stringify(o));

  // ---------- قاعدة الحد الأدنى للبُعد ----------
  // يُطبَّق الحد على كل بُعد قبل الضرب، وليس max(المساحة، 1).
  function calcDims(w, h, qty, opts) {
    const min = opts && opts.minDimension != null ? opts.minDimension : 1;
    const apply = !opts || opts.applyMin !== false;
    const wMm = toMm(w), hMm = toMm(h), minMm = toMm(min);
    const q = Number(qty);
    const cwMm = apply ? Math.max(wMm, minMm) : wMm;
    const chMm = apply ? Math.max(hMm, minMm) : hMm;
    const actualPiece = area(wMm, hMm);
    const billedPiece = area(cwMm, chMm);
    return {
      width: wMm / 1000, height: hMm / 1000,
      calcWidth: cwMm / 1000, calcHeight: chMm / 1000,
      qty: q,
      actualPiece, billedPiece,
      actualLine: round(actualPiece * q, 4),
      billedLine: round(billedPiece * q, 4),
      minApplied: apply && (cwMm !== wMm || chMm !== hMm),
    };
  }

  // ---------- الصلاحيات ----------
  const PERMS = {

  };
  const ROLES = { owner: 'مالك النظام', admin: 'مدير النظام', sales_manager: 'مدير المبيعات', seller: 'مندوب مبيعات' };
  function can(user, perm) {
    if (!user) return false;
    if (user.role === 'owner' || user.role === 'admin') return true;
    return (user.grants || []).includes(perm);
  }

  // ---------- وصف الفتحة ----------
  const byId = (list, id) => (list || []).find((x) => x.id === id);

  function glassKey(g) {
    if (!g) return '';
    return [g.config, g.appearance, g.thickness || '', g.tint || 'none', g.pricing || 'included'].join('/');
  }
  function glassLabel(db, g) {
    if (!g) return '';
    const c = byId(db.glass.configs, g.config), a = byId(db.glass.appearances, g.appearance);
    const t = byId(db.glass.tints, g.tint);
    return ['زجاج', c ? c.name : '?', a ? a.name : '?', g.thickness || '', t && t.id !== 'none' ? t.name : '']
      .filter(Boolean).join(' ');
  }
  // نوع الفتح الأساسي: سحاب / ثابت / مفصلي، وكل عائلة تضم أنواع الفتح التابعة لها
  const FAMILIES = [
    { id: 'sliding', name: 'سحاب', systems: ['sliding', 'lift-slide', 'folding'], types: ['sliding', 'lift-slide', 'folding', 'tilt-slide', 'multi-slide'] },
    { id: 'fixed', name: 'ثابت', systems: null, types: ['fixed'] },
    { id: 'casement', name: 'مفصلي', systems: ['casement', 'pivot'], types: ['casement', 'tilt-turn', 'tilt', 'awning', 'pivot', 'h-pivot'] },
  ];
  function familyOf(otId) { const f = FAMILIES.find((x) => x.types.includes(otId)); return f ? f.id : ''; }
  // الاسم المركّب: «PVC مفصلي — نافذة» ثم الشركة والسلسلة ونوع الفتح واللون
  function productLabel(db, o) {
    const cat = byId(db.categories, o.categoryId), co = byId(db.companies, o.companyId), s = byId(db.series, o.seriesId);
    const pt = byId(db.productTypes, o.productTypeId), ot = byId(db.openingTypes, o.openingTypeId), col = byId(db.colors, o.colorId);
    const fam = byId(FAMILIES, familyOf(o.openingTypeId));
    const head = [cat && cat.name, fam && fam.name].filter(Boolean).join(' ') + (pt ? ' — ' + pt.name : '');
    return [head, co && co.name, s && s.name, ot && ot.name, col && ('لون ' + col.name)]
      .filter(Boolean).join(' / ');
  }

  // أبعاد الحساب: مقاس التصنيع المعتمد إن وُجد، وإلا مقاس المعاينة
  function pricingDims(o) {
    if (o.mfg && o.mfg.approved && Number(o.mfg.width) > 0 && Number(o.mfg.height) > 0)
      return { width: o.mfg.width, height: o.mfg.height, source: 'mfg' };
    return { width: o.survey.width, height: o.survey.height, source: 'survey' };
  }

  function accTotalQty(a, qty) {
    if (a.totalOverride != null && a.totalOverride !== '') return Number(a.totalOverride);
    return round(Number(a.perPiece || 0) * Number(qty), 3);
  }

  // حساب فتحة واحدة كاملة
  function calcOpening(db, o) {
    const pt = byId(db.productTypes, o.productTypeId);
    const d = pricingDims(o);
    const dims = calcDims(d.width, d.height, o.qty, { minDimension: db.settings.minDimension, applyMin: pt ? pt.minRule !== false : true });
    const price = Number(o.pricePerM2 || 0);
    const productTotal = money(dims.billedLine * price);
    const glassExtra = o.glass && o.glass.pricing === 'extra'
      ? { price: Number(o.glass.extraPrice || 0), area: dims.billedLine, total: money(dims.billedLine * Number(o.glass.extraPrice || 0)) }
      : null;
    const accessories = (o.accessories || []).map((a) => {
      const total = accTotalQty(a, o.qty);
      const paid = a.mode === 'paid';
      return Object.assign({}, a, { totalQty: total, lineTotal: paid ? money(total * Number(a.price || 0)) : 0 });
    });
    let shutter = null;
    if (o.shutter && o.shutter.enabled) {
      const basis = o.shutter.basis === 'actual' ? 'actual' : 'billed';
      const sArea = basis === 'actual' ? dims.actualLine : dims.billedLine;
      shutter = Object.assign({}, o.shutter, { basis, area: sArea, total: money(sArea * Number(o.shutter.price || 0)) });
    }
    const paidExtras = money(accessories.reduce((s, a) => s + a.lineTotal, 0) + (glassExtra ? glassExtra.total : 0) + (shutter ? shutter.total : 0));
    return { dims, dimsSource: d.source, productTotal, glassExtra, accessories, shutter, total: money(productTotal + paidExtras) };
  }

  // ---------- التحقق ----------
  function validateOpenings(db, openings) {
    const errors = [];
    const codes = new Map();
    openings.forEach((o) => {
      const tag = o.code || '(بدون رمز)';
      const code = (o.code || '').trim().toUpperCase();
      if (!code) errors.push(`${tag}: الرمز مطلوب`);
      else if (codes.has(code)) errors.push(`${tag}: الرمز مكرر داخل المشروع`);
      codes.set(code, true);
      ['categoryId', 'companyId', 'seriesId', 'productTypeId', 'openingTypeId', 'colorId'].forEach((k) => {
        if (!o[k]) errors.push(`${tag}: ${FIELD_NAMES[k]} مطلوب`);
      });
      if (!o.glass || !o.glass.config || !o.glass.appearance) errors.push(`${tag}: مواصفات الزجاج ناقصة`);
      if (!(Number(o.survey && o.survey.width) > 0) || !(Number(o.survey && o.survey.height) > 0)) errors.push(`${tag}: مقاس المعاينة غير صالح`);
      if (!Number.isInteger(Number(o.qty)) || Number(o.qty) < 1) errors.push(`${tag}: العدد يجب أن يكون عددًا صحيحًا ≥ 1`);
      if (!(Number(o.pricePerM2) > 0)) errors.push(`${tag}: سعر المتر غير محدد`);
      const seen = new Set();
      (o.accessories || []).forEach((a) => {
        if (seen.has(a.accId)) errors.push(`${tag}: الإكسسوار «${a.name}» مكرر في نفس الفتحة`);
        seen.add(a.accId);
        if (a.mode !== 'included' && a.mode !== 'paid') errors.push(`${tag}: حدّد هل «${a.name}» مشمول أو مدفوع`);
        if (a.mode === 'paid' && !(Number(a.price) > 0)) errors.push(`${tag}: سعر «${a.name}» غير محدد`);
        if (!(accTotalQty(a, o.qty) > 0)) errors.push(`${tag}: كمية «${a.name}» غير صالحة`);
      });
      if (o.shutter && o.shutter.enabled) {
        if (!o.shutter.colorId) errors.push(`${tag}: لون السرانتي مطلوب`);
        if (!(Number(o.shutter.price) > 0)) errors.push(`${tag}: سعر متر السرانتي غير محدد`);
      }
      if (o.glass && o.glass.pricing === 'extra' && !(Number(o.glass.extraPrice) > 0)) errors.push(`${tag}: سعر الزجاج الإضافي غير محدد`);
    });
    return errors;
  }
  const FIELD_NAMES = { categoryId: 'الفئة', companyId: 'الشركة', seriesId: 'السلسلة', productTypeId: 'نوع المنتج', openingTypeId: 'نوع الفتح', colorId: 'اللون' };

  // ---------- الفاتورة المجمعة ----------
  function buildDocument(db, openings, opts) {
    opts = opts || {};
    const groups = new Map();
    const details = [];
    const add = (key, init, fn) => { if (!groups.has(key)) groups.set(key, Object.assign({ key, pieces: 0, quantity: 0, total: 0, codes: [] }, init)); fn(groups.get(key)); };

    openings.forEach((o) => {
      const c = calcOpening(db, o);
      const pLabel = productLabel(db, o), gLabel = glassLabel(db, o.glass);
      const minRule = (byId(db.productTypes, o.productTypeId) || {}).minRule !== false;
      // البند المجمع: يُجمع فقط ما تطابق في المواصفات وسعر المتر
      const pKey = ['P', o.categoryId, o.companyId, o.seriesId, o.productTypeId, o.openingTypeId, o.colorId, glassKey(o.glass), Number(o.pricePerM2), minRule ? 1 : 0].join('|');
      const shape = { productTypeId: o.productTypeId, openingTypeId: o.openingTypeId, appearance: o.glass && o.glass.appearance,
        colorId: o.colorId, shutterColorId: o.shutter && o.shutter.enabled ? o.shutter.colorId : '', design: o.design || null };
      add(pKey, { type: 'product', shape, description: pLabel + ' — ' + gLabel + (o.glass && o.glass.pricing === 'extra' ? ' (الزجاج مسعّر منفصلًا)' : ' (الزجاج مشمول)'), unit: 'م²', unitPrice: Number(o.pricePerM2) }, (g) => {
        g.pieces += Number(o.qty); g.quantity = round(g.quantity + c.dims.billedLine, 4); g.codes.push(o.code);
      });
      if (c.glassExtra) {
        add(['G', glassKey(o.glass), c.glassExtra.price].join('|'), { type: 'glass', description: 'إضافة ' + gLabel, unit: 'م²', unitPrice: c.glassExtra.price }, (g) => {
          g.pieces += Number(o.qty); g.quantity = round(g.quantity + c.glassExtra.area, 4); g.codes.push(o.code);
        });
      }
      c.accessories.filter((a) => a.mode === 'paid').forEach((a) => {
        add(['A', a.accId, a.code, a.unit, Number(a.price), a.color || ''].join('|'), { type: 'accessory', accId: a.accId, name: a.name, code: a.code, description: a.name + (a.color ? ' — ' + a.color : ''), unit: a.unit, unitPrice: Number(a.price) }, (g) => {
          g.quantity = round(g.quantity + a.totalQty, 3); g.codes.push(o.code);
        });
      });
      if (c.shutter) {
        const col = byId(db.shutterColors, c.shutter.colorId);
        add(['S', c.shutter.colorId, Number(c.shutter.price), c.shutter.basis].join('|'), {
          type: 'shutter', code: 'SHUTTER', description: 'سرانتي (ستارة معدنية) — ' + (col ? col.name : '') + (c.shutter.basis === 'actual' ? ' — على المساحة الفعلية' : ' — على المساحة المفوترة'),
          unit: 'م²', unitPrice: Number(c.shutter.price),
        }, (g) => { g.pieces += Number(o.qty); g.quantity = round(g.quantity + c.shutter.area, 4); g.codes.push(o.code); });
      }
      details.push({
        openingId: o.id, code: o.code, location: o.location || '', product: pLabel, glass: gLabel,
        shape: Object.assign({ shutter: !!c.shutter }, shape), total: c.total,
        survey: { width: Number(o.survey.width), height: Number(o.survey.height) },
        mfg: o.mfg && o.mfg.approved ? { width: Number(o.mfg.width), height: Number(o.mfg.height) } : null,
        dimsSource: c.dimsSource,
        calcWidth: c.dims.calcWidth, calcHeight: c.dims.calcHeight, minApplied: c.dims.minApplied,
        qty: Number(o.qty), actualArea: c.dims.actualLine, billedArea: c.dims.billedLine,
        pricePerM2: Number(o.pricePerM2), productTotal: c.productTotal,
        accessories: c.accessories.map((a) => ({ accId: a.accId, code: a.code, name: a.name, unit: a.unit, perPiece: a.perPiece, totalQty: a.totalQty, mode: a.mode, price: Number(a.price || 0), lineTotal: a.lineTotal, color: a.color || '' })),
        shutter: c.shutter ? { color: (byId(db.shutterColors, c.shutter.colorId) || {}).name, basis: c.shutter.basis, area: c.shutter.area, price: Number(c.shutter.price), total: c.shutter.total } : null,
        glassExtra: c.glassExtra,
        addedAt: o.addedAt || null,
      });
    });

    const order = { product: 0, glass: 1, shutter: 2, accessory: 3 };
    const lines = [...groups.values()].map((g) => Object.assign(g, { total: money(g.quantity * g.unitPrice) }))
      .sort((a, b) => order[a.type] - order[b.type]);
    const subtotal = money(lines.reduce((s, l) => s + l.total, 0));
    const pieces = openings.reduce((s, o) => s + Number(o.qty), 0);
    const billedArea = round(openings.reduce((s, o) => s + calcOpening(db, o).dims.billedLine, 0), 4);
    const disc = opts.discount || { type: 'amount', value: 0 };
    const discountAmount = money(disc.type === 'percent' ? subtotal * Number(disc.value || 0) / 100 : Number(disc.value || 0));
    const afterDiscount = money(subtotal - discountAmount);
    const taxRate = Number(db.settings.taxRate || 0);
    const tax = money(afterDiscount * taxRate / 100);
    return { lines, details, totals: { pieces, billedArea, subtotal, discount: disc, discountAmount, afterDiscount, taxRate, tax, total: money(afterDiscount + tax) } };
  }

  // ---------- قائمة الأسعار المسطحة (للتحديث الجماعي والرفع من ملف) ----------
  // المفاتيح: m2:<series>:<productType>:<openingType|*>  acc:<id>  glass:<config>:<appearance>  shutter
  function priceItems(db, opts) {
    const includeEmpty = opts && opts.includeEmpty;
    const items = [];
    db.series.forEach((s) => {
      const co = byId(db.companies, s.companyId) || {};
      db.productTypes.forEach((pt) => {
        const entries = db.prices.filter((p) => p.seriesId === s.id && p.productTypeId === pt.id);
        if (!entries.length && includeEmpty) entries.push({ openingTypeId: '*', price: null });
        entries.forEach((p) => {
          const ot = p.openingTypeId === '*' ? null : byId(db.openingTypes, p.openingTypeId);
          items.push({ key: `m2:${s.id}:${pt.id}:${p.openingTypeId}`, kind: 'm2', label: `${co.name} / ${s.name} / ${pt.name}${ot ? ' / ' + ot.name : ''}`,
            companyId: s.companyId, categoryIds: co.categoryIds || [], unit: 'م²', price: p.price == null ? null : Number(p.price), demo: !!p.demo });
        });
      });
    });
    db.accessories.forEach((a) => items.push({ key: `acc:${a.id}`, kind: 'acc', label: `${a.code} — ${a.name}`, companyId: /roto/i.test(a.source || '') ? 'roto' : '',
      categoryIds: [], unit: a.unit, price: Number(a.price || 0) > 0 ? Number(a.price) : (includeEmpty ? null : 0), demo: !!a.demo }));
    db.glass.configs.forEach((c) => db.glass.appearances.forEach((a) => {
      const e = db.glass.extraPrices.find((x) => x.config === c.id && x.appearance === a.id);
      if (e || includeEmpty) items.push({ key: `glass:${c.id}:${a.id}`, kind: 'glass', label: `زجاج ${c.name} ${a.name} (إضافة)`, companyId: '', categoryIds: [], unit: 'م²', price: e ? Number(e.price) : null, demo: !!(e && e.demo) });
    }));
    items.push({ key: 'shutter', kind: 'shutter', label: 'سرانتي (ستارة معدنية)', companyId: '', categoryIds: [], unit: 'م²', price: Number(db.settings.shutterPricePerM2), demo: !!db.settings.shutterPriceDemo });
    return items;
  }
  // خطة زيادة/تخفيض: نسبة مئوية أو مبلغ ثابت، مع تقريب اختياري. لا تمس ما لا سعر له.
  function planBulk(items, o) {
    const v = Number(o.value), step = Number(o.round || 0);
    return items.filter((i) => i.price > 0).map((i) => {
      let n = o.mode === 'amount' ? i.price + v : i.price * (1 + v / 100);
      if (step > 0) n = Math.round(round(n / step, 6)) * step;
      return { key: i.key, label: i.label, unit: i.unit, old: i.price, price: money(n) };
    });
  }
  // قراءة ملف أسعار: CSV (من القالب أو Excel) أو JSON
  function parsePriceFile(text) {
    const digits = (x) => String(x).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g, '.').trim();
    const rows = [], errors = [];
    const push = (key, raw, line) => {
      key = String(key || '').trim(); const v = digits(raw == null ? '' : raw);
      if (!key) return;
      if (v === '') return; // سعر جديد فارغ = لا تغيير
      const n = Number(v);
      if (!Number.isFinite(n) || n <= 0) errors.push(`سطر ${line}: السعر «${raw}» غير صالح`);
      else rows.push({ key, price: n, line });
    };
    text = String(text || '').replace(/^﻿/, '');
    const t = text.trim();
    if (!t) return { rows, errors: ['الملف فارغ'] };
    if (t[0] === '[' || t[0] === '{') {
      let j; try { j = JSON.parse(t); } catch (e) { return { rows, errors: ['JSON غير صالح: ' + e.message] }; }
      if (Array.isArray(j)) j.forEach((r, i) => push(r.key, r.price, i + 1));
      else Object.keys(j).forEach((k, i) => push(k, j[k], i + 1));
      return { rows, errors };
    }
    const lines = t.split(/\r?\n/);
    const delim = [',', ';', '\t'].map((d) => [d, (lines[0].match(new RegExp(d === '\t' ? '\t' : d, 'g')) || []).length]).sort((a, b) => b[1] - a[1])[0][0];
    const split = (line) => { const out = []; let cur = '', q = false;
      for (let i = 0; i < line.length; i++) { const ch = line[i];
        if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
        else if (ch === '"') q = true; else if (ch === delim) { out.push(cur); cur = ''; } else cur += ch; }
      out.push(cur); return out; };
    let start = 0, priceCol = -1;
    const head = split(lines[0]).map((x) => x.trim());
    if (/^(key|المفتاح)$/i.test(head[0])) { start = 1; priceCol = head.findIndex((h) => /السعر الجديد|new|price_new/i.test(h)); if (priceCol < 0) priceCol = head.findIndex((h) => /^(price|السعر)$/i.test(h)); }
    for (let i = start; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      const c = split(lines[i]);
      push(c[0], priceCol >= 0 ? c[priceCol] : c[c.length - 1], i + 1);
    }
    return { rows, errors };
  }
  function priceTemplateCSV(db) {
    const q = (x) => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"';
    const lines = [['المفتاح', 'البيان', 'الوحدة', 'السعر الحالي', 'السعر الجديد'].map(q).join(',')];
    priceItems(db, { includeEmpty: true }).forEach((i) => lines.push([i.key, i.label, i.unit, i.price == null ? '' : i.price, ''].map(q).join(',')));
    return '﻿' + lines.join('\r\n');
  }

  function invoiceBalance(inv) {
    const supp = (inv.supplements || []).reduce((s, x) => s + x.doc.totals.total, 0);
    const credits = (inv.creditNotes || []).reduce((s, x) => s + Number(x.amount), 0);
    const paid = (inv.payments || []).reduce((s, x) => s + Number(x.amount), 0);
    const grand = money(inv.doc.totals.total + supp - credits);
    return { original: inv.doc.totals.total, supplements: money(supp), credits: money(credits), grand, paid: money(paid), remaining: money(grand - paid) };
  }

  // ---------- الخادم ----------
  function createServer(store) {
    // store: { load(): db|null, save(db) }
    let db = store.load();
    if (!db) throw new Error('لا توجد قاعدة بيانات');
    const persist = () => store.save(db);
    const now = () => (store.now ? store.now() : new Date().toISOString());
    const nid = (p) => p + '-' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
    const year = () => now().slice(0, 4);

    function fail(code, message) { const e = new Error(message); e.code = code; throw e; }
    function audit(user, action, target, detail) {
      db.audit.push({ id: nid('log'), at: now(), userId: user.id, userName: user.name, action, target: target || '', detail: detail || '' });
    }
    const getQuote = (id) => db.quotes.find((q) => q.id === id) || fail('NOT_FOUND', 'العرض غير موجود');
    const getInvoice = (id) => db.invoices.find((i) => i.id === id) || fail('NOT_FOUND', 'الفاتورة غير موجودة');

    // منع التكرار: الطلب نفسه بنفس المفتاح يعيد النتيجة السابقة دون تنفيذ ثانٍ
    function once(key, fn) {
      if (key && db.requests[key]) return Object.assign({ duplicate: true }, db.requests[key]);
      const r = fn();
      if (key) db.requests[key] = r;
      return r;
    }

    function priceFor(seriesId, productTypeId, openingTypeId) {
      const exact = db.prices.find((p) => p.seriesId === seriesId && p.productTypeId === productTypeId && p.openingTypeId === openingTypeId);
      const any = db.prices.find((p) => p.seriesId === seriesId && p.productTypeId === productTypeId && p.openingTypeId === '*');
      return exact || any || null;
    }

    function normalizeOpening(o) {
      const out = clone(o);
      out.id = out.id || nid('op');
      out.code = String(out.code || '').trim().toUpperCase();
      out.qty = Number(out.qty);
      out.survey = { width: Number(out.survey && out.survey.width), height: Number(out.survey && out.survey.height) };
      out.mfg = out.mfg ? { width: Number(out.mfg.width) || null, height: Number(out.mfg.height) || null, approved: !!out.mfg.approved } : { width: null, height: null, approved: false };
      out.accessories = (out.accessories || []).map((a) => {
        const cat = byId(db.accessories, a.accId) || {};
        return { accId: a.accId, code: cat.code || a.code, name: cat.name || a.name, unit: cat.unit || a.unit, perPiece: Number(a.perPiece), totalOverride: a.totalOverride === '' || a.totalOverride == null ? null : Number(a.totalOverride), mode: a.mode, price: Number(a.price), color: a.color || '' };
      });
      return out;
    }

    const views = {
      quote(q) { const v = clone(q); v.doc = buildDocument(db, q.openings, { discount: q.discount }); v.errors = validateOpenings(db, q.openings); return v; },
      invoice(i) { const v = clone(i); v.balance = invoiceBalance(i); return v; },
    };

    const A = {
      // ----- قراءة -----
      'session.me': { perm: null, run: (u) => ({ user: clone(u), perms: Object.keys(PERMS).filter((p) => can(u, p)) }) },
      'catalog.get': { perm: 'sales.view', run: () => clone({ settings: db.settings, categories: db.categories, companies: db.companies, series: db.series, productTypes: db.productTypes, openingTypes: db.openingTypes, colors: db.colors, shutterColors: db.shutterColors, glass: db.glass, accessories: db.accessories, hardwareColors: db.hardwareColors, prices: db.prices }) },
      'users.list': { perm: null, run: () => clone(db.users.map((u) => ({ id: u.id, name: u.name, role: u.role, grants: u.grants }))) },

        const errs = validateOpenings(db, q.openings);
        if (errs.length) fail('INVALID', errs.join('\n'));
        q.status = 'approved'; q.approvedAt = now(); q.approvedBy = u.id;

        audit(u, 'اعتماد عرض', q.no, `النسخة ${q.version}`);
        return views.quote(q);
      } },
      // تعديل العدد أو أي شيء بعد الاعتماد = نسخة جديدة تحتاج اعتمادًا
      'quote.revise': { perm: 'quote.edit', run: (u, p) => {
        const q = getQuote(p.id);

        q.history.push({ version: q.version, approvedAt: q.approvedAt, approvedBy: q.approvedBy, snapshot: q.approvedSnapshot });
        q.version += 1; q.status = 'draft'; q.approvedSnapshot = null; q.approvedAt = null;
        audit(u, 'نسخة معدّلة من عرض', q.no, `النسخة ${q.version}`);

      } },

      // ----- الفواتير -----
      'invoice.issue': { perm: 'invoice.issue', run: (u, p) => once(p.requestId, () => {
        const q = getQuote(p.quoteId);
        if (q.invoiceId) return { invoiceId: q.invoiceId, duplicate: true };
        if (q.status !== 'approved') fail('STATE', 'لا يُصدر إلا من نسخة معتمدة');
        const s = q.approvedSnapshot;
        db.counters.invoice += 1;
        const inv = {
          id: nid('inv'), no: `${db.settings.invoicePrefix}-${year()}-${String(db.counters.invoice).padStart(4, '0')}`,
          date: now().slice(0, 10), issuedAt: now(), issuedBy: u.id, quoteId: q.id, quoteNo: q.no, quoteVersion: s.version,
          customer: s.customer, project: s.project, site: s.site, notes: s.notes, terms: s.terms,
          currency: db.settings.currency, company: { name: db.settings.companyName, tagline: db.settings.companyTagline },
          openings: clone(s.openings),
          doc: buildDocument(db, s.openings, { discount: s.discount }), // نسخة محفوظة لا تتغير
          supplements: [], creditNotes: [], payments: [],
        };
        db.invoices.push(inv);
        q.status = 'invoiced'; q.invoiceId = inv.id;
        audit(u, 'إصدار فاتورة', inv.no, `من ${q.no} نسخة ${s.version}، الإجمالي ${inv.doc.totals.total}`);
        return { invoiceId: inv.id };
      }) },
      // ملحق: فتحات أضيفت بعد الإصدار، مؤرخة بتاريخ إضافتها، وتُحسب وحدها دون تكرار الأصل
      'invoice.supplement': { perm: 'invoice.amend', run: (u, p) => once(p.requestId, () => {
        const inv = getInvoice(p.invoiceId);
        const ops = (p.openings || []).map(normalizeOpening).map((o) => Object.assign(o, { addedAt: now().slice(0, 10) }));
        if (!ops.length) fail('INVALID', 'لا توجد فتحات مضافة');
        const all = inv.openings.concat(...inv.supplements.map((s) => s.openings), ops);
        const errs = validateOpenings(db, all);
        if (errs.length) fail('INVALID', errs.join('\n'));
        const before = invoiceBalance(inv);
        const sup = { id: nid('sup'), no: `${inv.no}-S${inv.supplements.length + 1}`, date: now().slice(0, 10), by: u.id, reason: p.reason || '', openings: ops, doc: buildDocument(db, ops, { discount: p.discount }), balanceBefore: before };
        inv.supplements.push(sup);
        audit(u, 'ملحق فاتورة', sup.no, `إضافة ${sup.doc.totals.pieces} قطعة بقيمة ${sup.doc.totals.total}`);

      }) },
      // تصحيح مالي موثق: لا يمسّ الفاتورة الأصلية، ويُحفظ مع سببه
      'invoice.credit': { perm: 'invoice.amend', run: (u, p) => once(p.requestId, () => {
        const inv = getInvoice(p.invoiceId);
        const amount = money(p.amount);
        if (!(amount > 0)) fail('INVALID', 'قيمة التصحيح غير صالحة');
        if (!String(p.reason || '').trim()) fail('INVALID', 'سبب التصحيح مطلوب');
        const b = invoiceBalance(inv);
        if (amount > b.grand) fail('INVALID', 'التصحيح أكبر من قيمة الفاتورة');
        const cn = { id: nid('cn'), no: `${inv.no}-C${inv.creditNotes.length + 1}`, date: now().slice(0, 10), by: u.id, amount, reason: p.reason, balanceBefore: b };
        inv.creditNotes.push(cn);
        audit(u, 'تصحيح مالي (إشعار دائن)', cn.no, `${amount} — ${p.reason}`);

      'payment.record': { perm: 'payment.record', run: (u, p) => once(p.requestId, () => {
        const inv = getInvoice(p.invoiceId);
        const amount = money(p.amount);

        db.counters.payment += 1;
        const pay = { id: nid('pay'), no: `RC-${year()}-${String(db.counters.payment).padStart(4, '0')}`, date: p.date || now().slice(0, 10), amount, method: p.method || 'نقدًا', note: p.note || '', by: u.id, at: now() };

      'invoice.export': { perm: 'export', run: (u, p) => { const inv = getInvoice(p.id); audit(u, 'طباعة/تصدير فاتورة', inv.no); return views.invoice(inv); } },
      'quote.export': { perm: 'export', run: (u, p) => { const q = getQuote(p.id); audit(u, 'طباعة/تصدير عرض', q.no); return views.quote(q); } },

      // ----- الإعدادات والكتالوج -----
      'settings.update': { perm: 'catalog.manage', run: (u, p) => {

      'color.add': { perm: 'quote.edit', run: (u, p) => {
        const list = p.kind === 'shutter' ? db.shutterColors : db.colors;

        if (!name) fail('INVALID', 'اسم اللون مطلوب');

        list.push(c);

        if (p.kind === 'glass') {
          let e = db.glass.extraPrices.find((x) => x.config === p.config && x.appearance === p.appearance);
          if (!e) { e = { config: p.config, appearance: p.appearance }; db.glass.extraPrices.push(e); }
          e.price = price; e.demo = false; audit(u, 'تحديد سعر', 'زجاج إضافي', `${p.config}/${p.appearance}: ${price}`); return clone(e);
        }
        if (p.kind === 'accessory') { const a = byId(db.accessories, p.accId) || fail('NOT_FOUND', 'غير موجود'); a.price = price; a.demo = false; audit(u, 'تحديد سعر', a.name, String(price)); return clone(a); }
        let e = db.prices.find((x) => x.seriesId === p.seriesId && x.productTypeId === p.productTypeId && x.openingTypeId === (p.openingTypeId || '*'));
        if (!e) { e = { id: nid('p'), seriesId: p.seriesId, productTypeId: p.productTypeId, openingTypeId: p.openingTypeId || '*' }; db.prices.push(e); }
        e.price = price; e.demo = false;
        audit(u, 'تحديد سعر', (byId(db.series, p.seriesId) || {}).name || '', `${price}/م²`);
        return clone(e);
      } },
      // تحديث أسعار جماعي (زيادة/تخفيض أو رفع ملف): ذري، ويُحفظ القديم والجديد في سجل الأسعار
      'prices.bulk': { perm: 'prices.manage', run: (u, p) => once(p.requestId, () => {
        const items = priceItems(db, { includeEmpty: true });
        const map = new Map(items.map((i) => [i.key, i]));
        const unknown = (p.changes || []).filter((c) => !map.has(c.key)).map((c) => c.key);
        if (unknown.length) fail('INVALID', 'مفاتيح غير معروفة: ' + unknown.slice(0, 5).join('، ') + (unknown.length > 5 ? ` (+${unknown.length - 5})` : ''));
        const changes = [];
        (p.changes || []).forEach((c) => {
          const it = map.get(c.key), price = money(c.price);
          if (!(price > 0)) fail('INVALID', `السعر الجديد لـ «${it.label}» غير صالح`);
          if (it.price === price && !it.demo) return;
          const k = c.key.split(':');
          if (k[0] === 'm2') {
            let e = db.prices.find((x) => x.seriesId === k[1] && x.productTypeId === k[2] && x.openingTypeId === k[3]);
            if (!e) { e = { id: nid('p'), seriesId: k[1], productTypeId: k[2], openingTypeId: k[3] }; db.prices.push(e); }
            e.price = price; e.demo = false;
          } else if (k[0] === 'acc') { const a = byId(db.accessories, k[1]); a.price = price; a.demo = false; }

            if (!e) { e = { config: k[1], appearance: k[2] }; db.glass.extraPrices.push(e); }
            e.price = price; e.demo = false;
          } else if (k[0] === 'shutter') { db.settings.shutterPricePerM2 = price; db.settings.shutterPriceDemo = false; }
          changes.push({ key: c.key, label: it.label, unit: it.unit, old: it.price, price });
        });
        if (!changes.length) fail('INVALID', 'لا توجد أسعار تغيّرت');
        db.priceHistory = db.priceHistory || [];
        const h = { id: nid('ph'), at: now(), by: u.id, userName: u.name, source: p.source === 'import' ? 'import' : 'bulk', reason: String(p.reason || ''), description: String(p.description || ''), changes };
        db.priceHistory.push(h);
        audit(u, p.source === 'import' ? 'رفع ملف أسعار' : 'تحديث أسعار جماعي', `${changes.length} سعر`, [h.description, h.reason].filter(Boolean).join(' — '));
        return { historyId: h.id, count: changes.length };
      }) },
      'prices.history': { perm: 'sales.view', run: () => clone((db.priceHistory || []).slice().reverse()) },
      'producttype.minrule': { perm: 'catalog.manage', run: (u, p) => {
        const pt = byId(db.productTypes, p.id) || fail('NOT_FOUND', 'غير موجود');
        pt.minRule = !!p.minRule; audit(u, 'قاعدة الحد الأدنى', pt.name, pt.minRule ? 'مفعّلة' : 'معطّلة'); return clone(pt);

      'user.grants': { perm: 'users.manage', run: (u, p) => {
        const target = byId(db.users, p.userId) || fail('NOT_FOUND', 'المستخدم غير موجود');

        if (target.role === 'admin' && u.role !== 'owner') fail('FORBIDDEN', 'صلاحيات مدير النظام يعدّلها المالك فقط');
        target.grants = (p.grants || []).filter((g) => PERMS[g]);
        audit(u, 'تعديل صلاحيات', target.name, target.grants.join('، ') || 'بدون');
        return clone(target);
      } },
    };

    const MUTATING = (name) => !/^(session|catalog\.get|users\.list|quotes\.list|quote\.get|invoices\.list|invoice\.get|price\.lookup|audit\.list|prices\.history)/.test(name);

    function handle(userId, action, payload) {
      const user = byId(db.users, userId);
      if (!user) fail('UNAUTHENTICATED', 'مستخدم غير معروف');
      const a = A[action] || fail('NOT_FOUND', 'عملية غير معروفة: ' + action);
      if (a.perm && !can(user, a.perm)) {
        if (MUTATING(action)) { audit(user, 'محاولة مرفوضة', action, PERMS[a.perm]); persist(); }
        fail('FORBIDDEN', `لا تملك صلاحية: ${PERMS[a.perm]}`);
      }
      // تنفيذ ذري: عند الخطأ تعود القاعدة لما كانت عليه
      const backup = MUTATING(action) ? JSON.stringify(db) : null;
      try {
        const r = a.run(user, payload || {});
        if (backup) persist();
        return r;
      } catch (e) {
        if (backup) db = JSON.parse(backup);
        throw e;
      }
    }

    db.priceHistory = db.priceHistory || [];
    return { handle, _db: () => db, reset(newDb) { db = newDb; persist(); } };
  }

  function memoryStore(initial, nowFn) {
    let data = clone(initial);
    return { load: () => data, save: (d) => { data = d; }, now: nowFn };
  }
  function localStore(key, seedFn) {
    return {
      load() {
        try {
          const s = localStorage.getItem(key);
          if (s) {
            const d = JSON.parse(s), fresh = seedFn();
            (fresh.catalog ? fresh.catalog.openingTypes : fresh.openingTypes || []).forEach((x) => {
              const list = d.catalog ? d.catalog.openingTypes : d.openingTypes;
              if (list && !list.some((y) => y.id === x.id)) list.push(x);
            });
            return d;
          }
        } catch (e) { /* يتابع بقاعدة جديدة */ }
        const d = seedFn(); try { localStorage.setItem(key, JSON.stringify(d)); } catch (e) {}
        return d;
      },
      save(d) { try { localStorage.setItem(key, JSON.stringify(d)); } catch (e) {} },
    };
  }

  return { priceItems, planBulk, parsePriceFile, priceTemplateCSV, calcDims, calcOpening, buildDocument, validateOpenings, invoiceBalance, createServer, memoryStore, localStore, can, PERMS, ROLES, round, money, productLabel, glassLabel, FAMILIES, familyOf };
});

      const B = Math.max(1.6, st * 1.1);
      const rows = design.rows, H = rows.reduce((a, r) => a + (Number(r.h) || 1), 0);
      const mainIdx = rows.reduce((m, r, i) => ((Number(r.h) || 1) > (Number(rows[m].h) || 1) ? i : m), 0);
      const usableH = ih - B * (rows.length - 1);
      let yy = iy;
      rows.forEach((row, ri) => {
        const rh = usableH * (Number(row.h) || 1) / H;

  // أيقونات الإكسسوارات حسب الرمز ثم حسب الاسم
  function accessory(a, px) {

      'lever-crank': rose + `<path d="M12.5 11 H19 L25 17 H29" stroke="${INK}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`,
      gear: `<rect x="13" y="3" width="6" height="26" rx="1.5" fill="#e6e8eb" stroke="${INK}" stroke-width="1.4"/><circle cx="16" cy="8" r="1.8" fill="${ACC}"/><circle cx="16" cy="24" r="1.8" fill="${ACC}"/><rect x="11" y="14" width="10" height="4" rx="1" fill="${INK}"/>`,
      'gear-double': `<rect x="13" y="3" width="6" height="26" rx="1.5" fill="#e6e8eb" stroke="${INK}" stroke-width="1.4"/><circle cx="16" cy="7" r="1.8" fill="${ACC}"/><circle cx="16" cy="12" r="1.8" fill="${ACC}"/><circle cx="16" cy="20" r="1.8" fill="${ACC}"/><circle cx="16" cy="25" r="1.8" fill="${ACC}"/><path d="M6 10 v-5 M6 5 l-2 2.5 M6 5 l2 2.5 M26 22 v5 M26 27 l-2 -2.5 M26 27 l2 -2.5" ${L.replace(INK, ACC)}/>`,
      lock: `<rect x="7" y="13" width="18" height="15" rx="2.5" fill="#e6e8eb" stroke="${INK}" stroke-width="1.5"/><path d="M11 13 v-4 a5 5 0 0 1 10 0 v4" ${L}/><circle cx="16" cy="19.5" r="2" fill="${INK}"/><rect x="15.2" y="20" width="1.6" height="4" fill="${INK}"/>`,
      hinge: `<rect x="5" y="7" width="9" height="18" rx="1.2" fill="#e6e8eb" stroke="${INK}" stroke-width="1.4"/><rect x="18" y="7" width="9" height="18" rx="1.2" fill="#e6e8eb" stroke="${INK}" stroke-width="1.4"/><rect x="14" y="5" width="4" height="22" rx="2" fill="${INK}"/><circle cx="9.5" cy="11" r="1" fill="${INK}"/><circle cx="9.5" cy="21" r="1" fill="${INK}"/><circle cx="22.5" cy="11" r="1" fill="${INK}"/><circle cx="22.5" cy="21" r="1" fill="${INK}"/>`,
      mesh: `<rect x="5" y="4" width="22" height="24" fill="#f3f4f6" stroke="${INK}" stroke-width="1.8"/>` + [9, 13, 17, 21, 25].map((v) => `<line x1="5" x2="27" y1="${v - 1}" y2="${v - 1}" stroke="#8b929c" stroke-width=".6"/>`).join('') + [9, 13, 17, 21, 25].map((v) => `<line y1="4" y2="28" x1="${v - 1}" x2="${v - 1}" stroke="#8b929c" stroke-width=".6"/>`).join(''),
      shutter: `<rect x="4" y="3" width="24" height="6" rx="1" fill="#d9dde2" stroke="${INK}" stroke-width="1.4"/>` + [11, 15, 19, 23].map((v) => `<rect x="5" y="${v}" width="22" height="3.2" rx=".8" fill="#e6e8eb" stroke="${INK}" stroke-width=".9"/>`).join('') + `<path d="M16 27 v2" ${L}/>`,
      glass: `<rect x="5" y="4" width="22" height="24" fill="${GLASS}" stroke="${INK}" stroke-width="1.6"/><path d="M9 14 l6 -6 M9 20 l10 -10" stroke="#fff" stroke-width="1.5"/>`,
      box: `<rect x="6" y="6" width="20" height="20" rx="3" fill="#e6e8eb" stroke="${INK}" stroke-width="1.5"/><path d="M11 16 h10 M16 11 v10" ${L}/>`,
    };
    return `<svg class="shape acc-ico" viewBox="0 0 32 32" width="${px}" height="${px}" role="img" aria-label="${name.replace(/"/g, '')}" xmlns="http://www.w3.org/2000/svg">${parts[kind]}</svg>`;
  }

  const CELL_TYPES = [
    { id: 'fixed', name: 'ثابت' }, { id: 'casement-l', name: 'مفصلي — مفصلات يسار' }, { id: 'casement-r', name: 'مفصلي — مفصلات يمين' },
    { id: 'tilt-turn-l', name: 'قلاب ومفصلي — يسار' }, { id: 'tilt-turn-r', name: 'قلاب ومفصلي — يمين' }, { id: 'tilt', name: 'قلاب' },

    { id: 'full', name: 'علوي وسفلي ووسط ثابت', rows: [{ h: 0.22, cells: [F_(), F_(2), F_()] }, { h: 1, cells: [L_(), F_(2), R_()] }, { h: 0.22, cells: [F_(), F_(2), F_()] }] },

    { id: 'doorTop', name: 'باب بشباك علوي', rows: [{ h: 0.25, cells: [F_()] }, { h: 1, cells: [L_()] }] },
  ];
  return { opening, accessory, colorHex, CELL_TYPES, PRESETS };
});

<script>/* واجهة منظومة العماد — تبويب المبيعات */
(function () {
  'use strict';
  const C = window.AlemadCore, S = window.AlemadSeed, SH = window.AlemadShapes;
  const server = C.createServer(C.localStore('alemad.db.v1', S.seed));
  let userId = window.ALEMAD_CUSTOMER ? 'u-salesmgr' : (lsGet('alemad.user') || 'u-owner');
  let CAT = null, ME = null;
  const LOCKED = new Set(); // نماذج نُفذت للتو وتنتظر تعديلًا قبل التنفيذ التالي

  // ---------- أدوات ----------
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  const $$ = (s, r) => [...(r || document).querySelectorAll(s)];

  const fm = (x) => `<span class="num">${Number(x || 0).toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 3 })}</span>`;
  const fmc = (x) => `<span class="money">${fm(x)}<span>${esc(cur())}</span></span>`;
  const fa = (x) => `<span class="num">${Number(x || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 })}</span>`;
  const fd = (x) => `<span class="num">${Number(x || 0).toFixed(2)}</span>`;
  const dims = (w, h) => `<span class="num">${Number(w).toFixed(2)} × ${Number(h).toFixed(2)}</span>`;
  const can = (p) => ME && ME.perms.includes(p);
  // الرسم التوضيحي لفتحة: يستخدم مقاس التصنيع المعتمد إن وُجد
  // لون الرسم: من اللون المختار للإطار وللسرانتي
  function hexOf(list, id) { const c = byId(list, id); return c ? SH.colorHex(c.name, c.hex) : ''; }
  function paintShape(s) { return Object.assign({}, s, { frameColor: hexOf(CAT.colors, s.colorId), shutterColor: hexOf(CAT.shutterColors, s.shutterColorId) }); }
  function figOpening(o, opt) {
    const m = o.mfg && o.mfg.approved && Number(o.mfg.width) > 0 ? o.mfg : o.survey || {};
    const sh = !!(o.shutter && o.shutter.enabled);
    return SH.opening({ productTypeId: o.productTypeId, openingTypeId: o.openingTypeId, width: m.width, height: m.height, appearance: o.glass && o.glass.appearance, shutter: sh,
      frameColor: hexOf(CAT.colors, o.colorId), shutterColor: sh ? hexOf(CAT.shutterColors, o.shutter.colorId) : '', design: o.design || null }, opt);
  }
  function lineIcon(l) {
    if (l.type === 'product') return SH.opening(paintShape(l.shape || {}), { size: 60, px: 38 });
    if (l.type === 'shutter') return SH.accessory({ code: 'SHUTTER' }, 30);
    if (l.type === 'glass') return SH.accessory({ name: 'زجاج' }, 30);

  }
  // يعزل كل جزء من الوصف حتى لا ينقلب ترتيب الأسماء اللاتينية داخل النص العربي
  const bidi = (s) => String(s || '').split(' / ').map((p) => `<bdi>${esc(p)}</bdi>`).join(' / ');

  // ---------- قائمة منسدلة بخيارات مصوّرة ----------
  // الزر يعرض المختار مع رسمه، والقائمة تفتح تحته. تعمل بالفأرة واللمس والأسهم وEsc.
  function dd(key, act, list, v, ph) {
    const sel = list.find((x) => x.id === v);
    const body = (x) => `${x.icon ? `<span class="dd-ico">${x.icon}</span>` : ''}<span class="dd-txt"><bdi>${esc(x.name)}</bdi>${x.sub ? `<small>${esc(x.sub)}</small>` : ''}</span>`;

  document.addEventListener('keydown', (e) => {
    const d = e.target.closest && e.target.closest('.dd'); if (!d) return;
    if (e.key === 'Escape' && d.classList.contains('open')) { e.stopPropagation(); closeDD(); $('.dd-btn', d).focus(); return; }

  // ---------- الإطار ----------
  // وضع العرض للعميل: حساب مدير مبيعات، بلا كتالوج أو أسعار أو صلاحيات أو تدقيق أو تبديل مستخدم
  const CUSTOMER = !!window.ALEMAD_CUSTOMER;
  const NAV = [
    ['#/quotes', 'العروض', 'sales.view'], ['#/invoices', 'الفواتير', 'sales.view'],
    ['#/catalog', 'الكتالوج والأسعار', null], ['#/users', 'الصلاحيات', null], ['#/audit', 'سجل التدقيق', 'audit.view'],
  ];
  function frame() {
    const users = api('users.list', {}) || [];
    document.body.innerHTML = `
      <header class="topbar"><div class="topbar-in">
        <div class="brand"><div class="brand-mark">ع</div><div>العماد<small>منظومة المبيعات — نموذج أولي</small></div></div>
        <div class="who"><span>المستخدم:</span>
          <select id="who" aria-label="تبديل المستخدم">${users.map((u) => `<option value="${u.id}" ${u.id === userId ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>
        </div>

    $('#who').onchange = (e) => { userId = e.target.value; lsSet('alemad.user', userId); route(); };
    if (CUSTOMER) { const w = $('.who'); if (w) w.parentNode.removeChild(w); }

    try { localStorage.setItem('alemad.probe', '1'); localStorage.removeItem('alemad.probe'); } catch (e) { canStore = false; }

  }

  function setPath(obj, path, v) { const k = path.split('.'); let o = obj; k.slice(0, -1).forEach((p) => { o[p] = o[p] || {}; o = o[p]; }); o[k[k.length - 1]] = v; }

  // ---------- الإدخال السريع: تُجمع الفتحات أولًا بمواصفات مشتركة، ثم تُفصَّل كل واحدة لاحقًا ----------

  function bindQE() {
    const box = $('#qe'); const sh = QE.shared;

      const k = el.dataset.qs;
      if (el.tagName !== 'SELECT') { el.oninput = () => setPath(sh, k, el.value); return; }
      el.onchange = () => {
        setPath(sh, k, el.value);
        const chain = ['categoryId', 'familyId', 'companyId', 'seriesId'];
        const i = chain.indexOf(k); if (i >= 0) chain.slice(i + 1).forEach((x) => { if (!(k === 'categoryId' && x === 'familyId')) sh[x] = ''; });
        if (k === 'familyId') QE.rows.forEach((r) => { if (r.productTypeId && (sh.familyId === 'fixed') !== (r.productTypeId === 'fixed')) r.productTypeId = ''; });
        const { ots } = options(sh);
        QE.rows.forEach((r) => { if (r.openingTypeId && !ots.some((o) => o.id === r.openingTypeId)) r.openingTypeId = ''; if (ots.length === 1) r.openingTypeId = ots[0].id; qeLookup(r); });

      if (el.tagName === 'SELECT') { el.onchange = () => { r[f] = el.value; qeLookup(r); drawQE(); }; return; }
      el.oninput = () => { r[f] = el.value; if (f === 'price') r.manual = true; count(); };
      el.onkeydown = (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (+i === QE.rows.length - 1) {
          const n = qeRow(); n.productTypeId = r.productTypeId; n.openingTypeId = r.openingTypeId; qeLookup(n); QE.rows.push(n); drawQE();
        }
        const next = $(`[data-qr="${+i + 1}.${f}"]`, $('#qe')); if (next) next.focus();
      };
    });
    $$('[data-qdel]', box).forEach((b) => (b.onclick = () => { QE.rows.splice(+b.dataset.qdel, 1); if (!QE.rows.length) QE.rows.push(qeRow()); drawQE(); }));
    $('#qe-add-row').onclick = () => { const last = QE.rows[QE.rows.length - 1] || {}; const n = qeRow(); n.productTypeId = last.productTypeId || ''; n.openingTypeId = last.openingTypeId || ''; qeLookup(n); QE.rows.push(n); drawQE(); };
    $('#qe-go').onclick = () => {

      const existing = Q.openings.slice();

          location: r.location, qty: Math.max(1, Math.round(Number(r.qty) || 1)), pricePerM2: Number(r.price) || 0, priceSource: r.manual ? '' : (r.price ? 'list' : 'none') });
        Object.assign(o.glass, { config: sh.glass.config, appearance: sh.glass.appearance, thickness: sh.glass.thickness });
        o.survey = { width: Number(r.w), height: Number(r.h) };

        o.code = nextCode(o.productTypeId, existing);
        existing.push(o); Q.openings.push(o);

  // جدول بنود العرض: سطر لكل فتحة، والمواصفات في سطر واحد، ومقاس التصنيع أو حالة القياس
  function openingTable(list, ed) {

      const acc = o.accessories.map((a) => (byId(CAT.accessories, a.accId) || {}).name).filter(Boolean);

  if (window.qrcode) window.qrcode.stringToBytes = window.qrcode.stringToBytesFuncs['UTF-8'];

    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
    return `<svg class="qr" viewBox="${-m} ${-m} ${n + 2 * m} ${n + 2 * m}" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="رمز QR للفاتورة" xmlns="http://www.w3.org/2000/svg"><rect x="${-m}" y="${-m}" width="${n + 2 * m}" height="${n + 2 * m}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;

  // ---------- رمز QR لتحميل الفاتورة: بيانات الفاتورة مضغوطة داخل رابط على موقع النظام ----------
  const DEFAULT_PUBLIC_URL = 'https://3mar3ashour.github.io/alemad-sales-demo/';

    if (/^https?:$/.test(location.protocol) && !/claude\.ai|claudeusercontent/.test(location.host) && !/^(localhost|127\.)/.test(location.hostname)) return location.origin + location.pathname;
    return DEFAULT_PUBLIC_URL;
  }
  const b64u = (bytes) => toB64(bytes).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64u = (s) => { const b = atob(s.replace(/-/g, '+').replace(/_/g, '/')); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  async function packData(obj) {
    const raw = new TextEncoder().encode(JSON.stringify(obj));
    if (window.CompressionStream) {
      const buf = await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();

  async function invoiceLink(inv) {

  // ---------- تصميم النافذة أو الباب: صفوف وخلايا، لكل خلية نوعها ----------
  const ROW_NAME = (i, n, main) => (n === 1 ? 'الأقسام' : i === main ? 'الصف الرئيسي' : i < main ? 'الصف العلوي' : 'الصف السفلي');
  const mainRow = (rows) => rows.reduce((m, r, i) => ((r.h || 1) > (rows[m].h || 1) ? i : m), 0);
  function designStep() {
    if (!D.productTypeId || D.familyId === 'sliding') return '';
    const isDoor = D.productTypeId === 'door';
    const fc = hexOf(CAT.colors, D.colorId);
    const cur = D.design ? JSON.stringify(D.design.rows) : '';
    const tiles = SH.PRESETS.map((pr) => `<button type="button" class="preset ${cur === JSON.stringify(pr.rows) ? 'on' : ''}" data-preset="${pr.id}" aria-pressed="${cur === JSON.stringify(pr.rows)}">
        ${SH.opening({ productTypeId: D.productTypeId, openingTypeId: 'casement', frameColor: fc, design: { rows: pr.rows }, width: isDoor ? 1 : 1.8, height: isDoor ? 2.2 : 1.4 }, { size: 70, px: 60 })}<span>${esc(pr.name)}</span></button>`).join('');

      const rows = D.design.rows, m = mainRow(rows);
      const typeSel = (i, j, v) => `<select data-celltype="${i}.${j}" aria-label="نوع القسم">${SH.CELL_TYPES.map((c) => `<option value="${c.id}" ${c.id === v ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`;
      const wSel = (i, j, v) => `<select data-cellw="${i}.${j}" aria-label="عرض القسم"><option value="1" ${v != 2 ? 'selected' : ''}>عادي</option><option value="2" ${v == 2 ? 'selected' : ''}>عريض</option></select>`;
      ed = `<div class="design-ed">${rows.map((r, i) => `<div class="drow">
          <div class="drow-h"><b>${ROW_NAME(i, rows.length, m)}</b>
            <label class="row small">عدد الأقسام <select data-rowcount="${i}">${[1, 2, 3, 4].map((n) => `<option ${n === r.cells.length ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
            ${i !== m ? `<button type="button" class="btn sm danger" data-delrow="${i}">حذف الصف</button>` : ''}</div>
          <div class="dcells">${r.cells.map((c, j) => `<div class="dcell"><span class="small muted">القسم ${j + 1}</span>${typeSel(i, j, c.type)}${wSel(i, j, c.w)}</div>`).join('')}</div>
        </div>`).join('')}
        <div class="row">${m === 0 ? '<button type="button" class="btn sm" data-addrow="top">+ صف علوي</button>' : ''}${m === rows.length - 1 ? '<button type="button" class="btn sm" data-addrow="bottom">+ صف سفلي</button>' : ''}
          <span class="spacer"></span><button type="button" class="btn sm ghost" data-dclear="1">بدون تصميم (حسب نوع الفتح)</button></div></div>`;
    }
    return `<div class="step ${D.design ? 'done' : ''}"><div class="step-t"><i>8</i>تصميم ${isDoor ? 'الباب' : 'النافذة'}</div>
      <div class="small muted" style="margin-bottom:8px">اختر قالبًا، ثم عدّل الصفوف والأقسام ونوع كل قسم. الرسم يتحدث مباشرة، والسعر لا يتغير لأنه بالمتر المربع.</div>
      <div class="presets">${tiles}</div>${ed}</div>`;
  }
  function bindDesign(body) {
    const at = (key) => key.split('.').map(Number);
    $$('[data-preset]', body).forEach((b) => (b.onclick = () => { const pr = SH.PRESETS.find((x) => x.id === b.dataset.preset); D.design = { rows: JSON.parse(JSON.stringify(pr.rows)) }; renderModal(); }));
    $$('[data-dclear]', body).forEach((b) => (b.onclick = () => { D.design = null; renderModal(); }));
    $$('[data-addrow]', body).forEach((b) => (b.onclick = () => { const r = { h: 0.25, cells: [{ w: 1, type: 'fixed' }] }; if (b.dataset.addrow === 'top') D.design.rows.unshift(r); else D.design.rows.push(r); renderModal(); }));
    $$('[data-delrow]', body).forEach((b) => (b.onclick = () => { D.design.rows.splice(+b.dataset.delrow, 1); renderModal(); }));
    $$('[data-rowcount]', body).forEach((el) => (el.onchange = () => {
      const r = D.design.rows[+el.dataset.rowcount], n = +el.value;
      while (r.cells.length < n) r.cells.push({ w: 1, type: 'fixed' });
      r.cells.length = n; renderModal();
    }));
    $$('[data-celltype]', body).forEach((el) => (el.onchange = () => { const [i, j] = at(el.dataset.celltype); D.design.rows[i].cells[j].type = el.value; renderModal(); }));
    $$('[data-cellw]', body).forEach((el) => (el.onchange = () => { const [i, j] = at(el.dataset.cellw); D.design.rows[i].cells[j].w = +el.value; renderModal(); }));
  }
  function accRow(a, i) {
    const cat = byId(CAT.accessories, a.accId) || {};
    const isRoto = /^ROTO/.test(cat.code || '');
    const tot = a.totalOverride !== '' && a.totalOverride != null ? Number(a.totalOverride) : Number(a.perPiece || 0) * Number(D.qty || 0);
    return `<div class="acc-row">
      <div><span class="acc-name">${SH.accessory(cat, 30)}<span><b>${esc(cat.code)}</b> ${esc(cat.name)} <span class="muted small">(${esc(cat.unit)})</span></span></span>
        ${isRoto ? `<select data-k="accessories.${i}.color" style="margin-top:4px"><option value="">لون المقبض —</option>${CAT.hardwareColors.map((c) => `<option ${c === a.color ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>` : ''}</div>
      <label class="f">لكل قطعة<input type="number" min="0" step="1" data-k="accessories.${i}.perPiece" value="${esc(a.perPiece)}"></label>
      <label class="f">الإجمالي<input type="number" min="0" step="1" data-k="accessories.${i}.totalOverride" value="${a.totalOverride == null ? '' : esc(a.totalOverride)}" placeholder="${esc(tot)}"></label>
      <div class="f"><span class="small" style="font-weight:600">التسعير</span><span class="seg"><button data-am="${i}" data-v="included" class="${a.mode === 'included' ? 'on' : ''}">مشمول</button><button data-am="${i}" data-v="paid" class="${a.mode === 'paid' ? 'on' : ''}">مدفوع</button></span></div>
      <label class="f">السعر${a.mode === 'paid' ? '' : ' (لا يُحسب)'}<input type="number" min="0" step="0.01" data-k="accessories.${i}.price" value="${esc(a.price)}" ${a.mode === 'paid' ? '' : 'disabled'}></label>
      <button class="btn sm danger" data-adel="${i}" aria-label="حذف">✕</button>
      <div class="tot small muted" id="acc-tot-${i}" style="grid-column:1/-1">${accTotText(a)}</div>
    </div>`;
  }
  function accTotText(a) {
    const ov = a.totalOverride !== '' && a.totalOverride != null;
    const tot = ov ? Number(a.totalOverride) : Number(a.perPiece || 0) * Number(D.qty || 0);
    return `${ov ? 'كمية إجمالية مخصصة' : `${esc(a.perPiece)} لكل قطعة × ${esc(D.qty)} قطعة`} = <b>${fd(tot)}</b>${a.mode === 'paid' ? ` × ${fm(a.price)} = <b>${fm(tot * Number(a.price || 0))}</b>` : ' — مشمول، لا يضاف للفاتورة'}`;
  }
  function calcPanel() {
    const ok = Number(D.survey.width) > 0 && Number(D.survey.height) > 0 && Number(D.qty) > 0;
    if (!ok) return `<h2>الحساب</h2>${D.productTypeId ? `<div class="calc-fig">${figOpening(D, { size: 170, px: 150 })}</div>` : ''}<div class="small muted">أدخل المقاسات والعدد لعرض الحساب.</div>`;
    const o = finalizeOpening(); const c = C.calcOpening(CAT, o);
    const pt = byId(CAT.productTypes, o.productTypeId);
    return `<h2>الحساب</h2>
      <div class="calc-fig">${figOpening(o, { size: 170, dims: true, px: 170 })}<div class="tiny muted">رسم توضيحي تقريبي</div></div>
      <div class="line"><span>المقاس المستخدم</span><b>${c.dimsSource === 'mfg' ? 'التصنيع المعتمد' : 'المعاينة'}</b></div>
      <div class="line"><span>المقاس الفعلي</span><b>${dims(c.dims.width, c.dims.height)}</b></div>

      ${pt && pt.minRule === false ? '<div class="small muted">قاعدة الحد الأدنى معطّلة لهذا النوع.</div>' : c.dims.minApplied ? '<div class="small" style="color:var(--warn)">كل بُعد أقل من متر احتُسب مترًا.</div>' : ''}
      <div class="line"><span>المساحة الفعلية للقطعة</span><b>${fa(c.dims.actualPiece)} م²</b></div>
      <div class="line"><span>المساحة المفوترة للقطعة</span><b>${fa(c.dims.billedPiece)} م²</b></div>
      <div class="line"><span>× العدد</span><b class="num">${c.dims.qty}</b></div>
      <div class="line"><span>المساحة المفوترة للسطر</span><b>${fa(c.dims.billedLine)} م²</b></div>
      <div class="line"><span>المنتج</span><b>${fm(c.productTotal)}</b></div>
      ${c.glassExtra ? `<div class="line"><span>زجاج إضافي</span><b>${fm(c.glassExtra.total)}</b></div>` : ''}
      ${c.accessories.filter((a) => a.mode === 'paid').map((a) => `<div class="line"><span>${esc(a.name)}</span><b>${fm(a.lineTotal)}</b></div>`).join('')}
      ${c.shutter ? `<div class="line"><span>سرانتي ${fa(c.shutter.area)} م²</span><b>${fm(c.shutter.total)}</b></div>` : ''}
